name: teknurpay
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.20+20

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.1.0
  get: ^4.7.3
  http: ^1.1.0
  image_picker: ^1.1.2
  dotted_border: ^2.1.0
  fluttertoast: ^8.2.4
  get_storage: ^2.1.1
  easy_localization: ^3.0.7
  flutter_timezone: ^5.0.1
  timezone_utc_offset: ^1.1.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  share_plus: ^12.0.0
  path_provider: ^2.1.3
  image: ^4.1.6
  permission_handler: ^11.0.1
  change_app_package_name: ^1.4.0
  connectivity_plus: ^6.0.5
  flutter_launcher_icons: ^0.14.3
  url_launcher: ^6.3.1
  carousel_slider: ^5.1.1
  flutter_inner_shadow: ^0.0.1
  intl: ^0.20.2
  image_gallery_saver_plus: ^4.0.1
  in_app_update: ^4.2.5
  google_fonts: ^7.0.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  device_info_plus: ^12.4.0
  uuid: ^4.6.0
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  image_path: "assets/icons/logo.png"


  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/langs/en-US.json
    - assets/langs/bn-BD.json
    - assets/langs/fa-IR.json
    - assets/langs/ar-AE.json
    - assets/langs/ps-AF.json
    - assets/langs/tr-TR.json
    - assets/loties/


  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto.ttf

    - family: Iranfont
      fonts:
        - asset: assets/fonts/iranfont.ttf

    - family: Iranfontregular
      fonts:
        - asset: assets/fonts/iranyekanregular.ttf

    - family: Iranfontbold
      fonts:
        - asset: assets/fonts/iranyekanbold.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
